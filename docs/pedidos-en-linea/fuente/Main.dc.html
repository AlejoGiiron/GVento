<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú del negocio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Outfit:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0f172a}a:hover{color:#334155}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f8fafc; font-family: Manrope, system-ui, sans-serif; color: #0f172a; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="background: {{brand}}; color: #ffffff; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: #ffffff; color: {{brand}}; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 700; font-size: 20px">SM</div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <h1 style="margin: 0; font-family: Outfit, sans-serif; font-size: 24px; font-weight: 700">Salchimelo</h1>
        <div style="font-size: 13px; display: flex; align-items: center; gap: 6px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #bbf7d0"></span>
          Abierto · hasta las 11:30 p. m.
        </div>
      </div>
    </div>
    <div style="display: flex; gap: 8px; font-size: 12px">
      <span style="background: rgba(255,255,255,0.18); padding: 6px 10px; border-radius: 999px">Envío desde $3.000</span>
      <span style="background: rgba(255,255,255,0.18); padding: 6px 10px; border-radius: 999px">Llega en 30–45 min</span>
      <span style="background: rgba(255,255,255,0.18); padding: 6px 10px; border-radius: 999px">Pago en línea</span>
    </div>
  </header>

  <div style="flex-grow: 1; overflow: hidden; padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 16px">
    <section aria-label="Promoción" style="background: #0f172a; color: #ffffff; border-radius: 16px; padding: 16px; display: flex; gap: 14px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #6ee7b7">PROMO DE HOY</span>
        <strong style="font-size: 17px">2 salchidobles + gaseosa 1,5 L</strong>
        <span style="font-size: 13px; color: #cbd5e1"><s>$38.000</s> &nbsp;<b style="color: #ffffff; font-size: 15px">$32.000</b> · hasta el domingo</span>
      </div>
      <button type="button" style="background: #10b981; color: #04241a; border: 0; border-radius: 12px; font: 700 14px Manrope, sans-serif; padding: 12px 14px; min-height: 44px">Agregar</button>
    </section>

    <nav aria-label="Categorías" style="display: flex; gap: 8px">
      <button type="button" style="background: #0f172a; color: #ffffff; border: 0; border-radius: 999px; padding: 10px 14px; font: 600 13px Manrope, sans-serif; min-height: 40px">Salchipapas</button>
      <button type="button" style="background: #ffffff; color: #334155; border: 1px solid #e2e8f0; border-radius: 999px; padding: 10px 14px; font: 600 13px Manrope, sans-serif; min-height: 40px">Hamburguesas</button>
      <button type="button" style="background: #ffffff; color: #334155; border: 1px solid #e2e8f0; border-radius: 999px; padding: 10px 14px; font: 600 13px Manrope, sans-serif; min-height: 40px">Bebidas</button>
    </nav>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{productos}}" as="p" hint-placeholder-count="4">
        <article style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 12px; display: flex; gap: 12px; align-items: center">
          <div style="width: 72px; height: 72px; border-radius: 12px; background: #fde9d9; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #9a3412; font-size: 11px; font-weight: 600">[FOTO]</div>
          <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
            <strong style="font-size: 15px">{{p.nombre}}</strong>
            <span style="font-size: 12px; color: #64748b">{{p.desc}}</span>
            <span style="font-size: 15px; font-weight: 700">{{p.precio}}</span>
          </div>
          <button type="button" aria-label="Agregar al carrito" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: {{brand}}; color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </article>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px; background: linear-gradient(rgba(248,250,252,0), #f8fafc 30%)">
    <a href="Checkout.dc.html" style="display: flex; align-items: center; gap: 12px; background: #0f172a; color: #ffffff; text-decoration: none; border-radius: 16px; padding: 14px 16px; min-height: 56px; box-sizing: border-box">
      <span style="background: #10b981; color: #04241a; font-weight: 800; border-radius: 10px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px">3</span>
      <span style="flex-grow: 1; font-weight: 700; font-size: 16px">Ver mi pedido</span>
      <span style="font-weight: 700; font-size: 16px">$48.000</span>
    </a>
    <div style="text-align: center; font-size: 11px; color: #64748b; margin-top: 8px">Pedidos con G-Vento</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#c2410c","options":["#c2410c","#b91c1c","#0f766e","#1d4ed8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      brand: this.props.brand ?? '#c2410c',
      productos: [
        { nombre: 'Salchidoble para 2', desc: 'Papa, salchicha, queso, salsas de la casa', precio: '$16.000' },
        { nombre: 'Salchipapa sencilla', desc: 'Papa, salchicha y salsas', precio: '$9.000' },
        { nombre: 'Salchipapa especial', desc: 'Con pollo desmechado y maíz', precio: '$14.000' },
        { nombre: 'Salchimelo XL', desc: 'Para compartir entre 3 o 4', precio: '$27.000' }
      ]
    };
  }
}
</script>
</body>
</html>
